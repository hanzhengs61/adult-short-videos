services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18
    container_name: adult-short-videos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adult_short_videos
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      - adult-short-videos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: adult-short-videos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - adult-short-videos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adult-short-videos-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=adult_short_videos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-production-secret-key
      - SERVER_MODE=release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adult-short-videos-network
    restart: unless-stopped
    volumes:
      - ./logs:/root/logs

volumes:
  postgres_data:
  redis_data:

networks:
  adult-short-videos-network:
    driver: bridge