server:
  port: ":8080"
  mode: debug  # debug, release
  read_timeout: 60s
  write_timeout: 60s
  cors_origins: ""  # 生产环境使用环境变量 CORS_ORIGINS，如 https://a.com,https://b.com
  # 静态资源域名前缀：开发留空（Vite 代理 /uploads），生产设环境变量 STATIC_ASSETS_BASE_URL=https://yourdomain.com
  static_assets_base_url: ""

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres  # 生产环境使用环境变量 DB_PASSWORD
  dbname: adult_short_videos
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # 1小时
  ssl_mode: disable  # 生产环境设置环境变量 DB_SSL_MODE=require

jwt:
  secret: your-secret-key-change-in-production  # 生产环境使用环境变量 JWT_SECRET
  access_expire: 86400     # 24小时
  refresh_expire: 604800   # 7天

redis:
  host: localhost
  port: 6379
  password: ""  # 生产环境使用环境变量 REDIS_PASSWORD
  db: 0

log:
  level: debug  # debug, info, warn, error
  file_path: ./logs/app.log
  max_size: 100     # MB
  max_backups: 5
  max_age: 30       # 天

metrics:
  enabled: true
  path: /metrics